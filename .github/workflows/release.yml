name: Release（自动构建安装器并发布）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: '手工发布所使用的版本号，例如 v0.2.0'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-installer:
    name: 构建并发布安装器（.exe）
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.releaseTag || github.ref_name }}
      APP_VERSION: ${{ github.event.inputs.releaseTag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查 + 测试（发布前 smoke）
        run: npm run typecheck && npm test

      - name: 构建（client + server）
        run: npm run build

      - name: 编译 start.exe（Go launcher）
        run: |
          cd scripts/launcher
          go build -o start.exe .
        shell: bash

      - name: 生成安装器图标
        run: python installer/make_icon.py
        shell: bash

      - name: 安装 Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: 编译 Windows 安装器（Inno Setup）
        shell: cmd
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          rem strip leading 'v' from version for Inno /DAppVersion
          set "APP_VERSION_NO_V=%APP_VERSION%"
          if "%APP_VERSION_NO_V:~0,1%"=="v" set "APP_VERSION_NO_V=%APP_VERSION_NO_V:~1%"
          "%ISCC%" /DAppVersion=%APP_VERSION_NO_V% installer\setup.iss

      - name: 列出安装器产物
        run: |
          ls -la release-installer
        shell: bash

      - name: 创建 GitHub Release（附安装器 + 标记版压缩包）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-installer/*.exe

      - name: 说明 Gitee 附件同步限制
        shell: bash
        run: |
          echo "Gitee 公开 API 不提供直接上传 release 二进制附件的接口（如需 Gitee 附件请手动上传）。"
          echo "安装器已发布到 GitHub Release（本 workflow 产物）。"
          echo "应用更新逻辑会优先经 GitHub 镜像（ghfast.top 等）下载该 .exe；Gitee 用于版本号探测。"
