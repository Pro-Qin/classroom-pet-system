name: Release（自动构建发布）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: '手工发布所使用的版本号，例如 v0.2.0'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.releaseTag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查 + 测试（发布前 smoke）
        run: npm run typecheck && npm test

      - name: 构建（client + server）
        run: npm run build

      - name: 打包可部署产物
        run: |
          mkdir -p release-package
          cp -r client/dist release-package/client
          cp -r server/dist release-package/server
          cp start.bat kiosk.bat deploy.bat deploy.sh package.json README.md release-package/
          cd release-package
          zip -qr "../classroom-pet-system-${{ env.RELEASE_TAG }}.zip" .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: classroom-pet-system-${{ env.RELEASE_TAG }}.zip